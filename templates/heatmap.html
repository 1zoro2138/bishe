{% extends "base.html" %}
{% block title %}全国票房热力图{% endblock %}
{% block content %}
    <h2>全国票房热力图 ({{ time_range }})</h2>
    {% if error %}
        <p style="color: red;">错误: {{ error }}</p>
    {% endif %}
    <div>
        <label for="month-select">选择月份: </label>
        <select id="month-select" onchange="window.location.href='/heatmap?month=' + this.value">
            <option value="">全部数据</option>
            {% for month in months %}
                <option value="{{ month }}" {% if month == selected_month %}selected{% endif %}>{{ month }}</option>
            {% endfor %}
        </select>
    </div>
    <div id="heatmap" style="width: 100%; height: 600px;margin-left: 50px;"></div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="{{ url_for('static', filename='js/china.js') }}"></script>
    <script src="{{ url_for('static', filename='js/heatmap.js') }}"></script>
    <script>
        var heatmapData = {{ heatmap_data | safe }};
        initHeatmap(heatmapData);
    </script>
{% endblock %}
